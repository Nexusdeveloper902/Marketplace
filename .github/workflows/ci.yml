name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest

    # Isolated PostgreSQL for migrations, seed and tests — keeps the shared
    # production database untouched.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxicar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/luxicar_test"
      AUTH_SECRET: "ci-luxicar-test-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup database
        run: bun run db:setup

      - name: Lint
        run: bun run lint

      - name: Test
        # Run with coverage so the suite and its coverage report are produced
        # in a single pass. The text table prints in the log; the lcov report
        # is uploaded below for tooling/inspection.
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: bun run build
        env:
          # Vercel sets this on its own builds; mirror it here so the Next config
          # takes the non-standalone branch that matches the Vercel adapter.
          VERCEL: "1"
