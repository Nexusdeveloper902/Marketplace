name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests (no DB required)
        run: bun run test:unit

  integration:
    name: Integration tests (DB-backed)
    runs-on: ubuntu-latest

    # Isolated PostgreSQL for migrations, seed and tests — keeps the shared
    # production database untouched.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxicar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/luxicar_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/luxicar_test"
      AUTH_SECRET: "ci-luxicar-test-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup database
        run: bun run db:setup

      - name: Integration tests
        # Full bun:test suite (scoped to src/) with coverage. Includes the
        # DB-backed data-layer tests (orders, analytics, brands, vehicles,
        # events) and the unit suite; Playwright specs under e2e/ are excluded
        # from bun discovery. The lcov report is uploaded below.
        run: bun test src/ --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: bun run build
        env:
          # Vercel sets this on its own builds; mirror it here so the Next config
          # takes the non-standalone branch that matches the Vercel adapter.
          VERCEL: "1"

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxicar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/luxicar_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/luxicar_test"
      AUTH_SECRET: "ci-luxicar-test-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup database
        run: bun run db:setup

      - name: Install Playwright browser (chromium + deps)
        run: bun run test:e2e:install

      - name: Run E2E tests
        # Playwright's webServer config starts `bun run dev` itself against the
        # same DATABASE_URL provisioned above, so the suite exercises the real
        # full stack (Prisma, server components, API routes, client state).
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
